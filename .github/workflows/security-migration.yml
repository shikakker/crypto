name: Security migration

on:
  push:
    branches:
      - portfolio-improvements-2026-08
    paths:
      - .github/workflows/security-migration.yml
      - tests/crypto-boundary.test.mjs

permissions:
  contents: write

jobs:
  migrate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-improvements-2026-08

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Patch stable runtime manifest
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.engines = { ...(pkg.engines || {}), node: '22.x' }
          pkg.dependencies = {
            next: '15.5.24',
            react: '18.2.0',
            'react-dom': '18.2.0'
          }
          pkg.devDependencies = {
            '@types/node': '^22.0.0',
            '@types/react': '^18.2.79',
            '@types/react-dom': '^18.2.25',
            eslint: '8.57.1',
            'eslint-config-next': '15.5.24',
            typescript: '^5.9.2'
          }
          pkg.overrides = { ...(pkg.overrides || {}), postcss: '8.5.28' }
          pkg.scripts = {
            ...pkg.scripts,
            lint: 'eslint . --max-warnings=0',
            typecheck: 'tsc --noEmit',
            test: 'node --test tests/*.test.mjs'
          }
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)
          NODE
          npm install --no-audit --no-fund

      - name: Regression contracts
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified dependency state
        run: |
          git config user.name 'Egor Denisov'
          git config user.email 'designer.egor@ya.ru'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: pin Web Crypto example runtime'
          git push origin HEAD:portfolio-improvements-2026-08
